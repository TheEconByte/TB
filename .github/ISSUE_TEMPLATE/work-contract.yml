name: 작업 계약
description: 구현을 시작하기 전에 목표·범위·소유 경로·검증을 확정한다. 이 Issue 번호가 작업 ID다.
title: "[작업] "
body:
  - type: markdown
    attributes:
      value: |
        규칙은 `AGENTS.md`, 절차는 `docs/TEAM_AI_WORKFLOW.md`를 따른다.
        이 Issue가 없는 AI 세션은 조사와 제안까지만 하고 파일을 수정하지 않는다.
        branch 이름은 `<type>/<이 Issue 번호>-<slug>`다.
  - type: input
    id: owner
    attributes:
      label: 인간 책임자
      description: GitHub 사용자명. AI는 책임자가 될 수 없다.
      placeholder: "@username"
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: 목표
      description: 사용자에게 달라지는 점 또는 확정할 기반 계약 하나.
    validations:
      required: true
  - type: textarea
    id: non-goals
    attributes:
      label: 비범위
      description: 이번 작업에서 하지 않을 일.
    validations:
      required: true
  - type: textarea
    id: paths
    attributes:
      label: 소유 경로
      description: 이 작업만 수정할 파일·디렉터리. 열린 Issue·PR과 겹치면 먼저 조정한다.
      placeholder: |
        app/src/features/market/
        docs/domains/market.md
    validations:
      required: true
  - type: checkboxes
    id: single-writer
    attributes:
      label: single-writer 영역 수정
      description: AGENTS.md의 single-writer 영역을 수정한다면 표시한다. 같은 영역을 수정하는 열린 작업이 없어야 한다.
      options:
        - label: Prisma schema·migrations
        - label: package.json·package-lock.json
        - label: 공통 API 타입·plans/schema.ts
        - label: 인증·세션·요청 보안 경계
        - label: 운영 적재기·manifest·자금 카탈로그
        - label: 컨텍스트 문서(AGENTS.md, PROJECT_CONTEXT.md, TEAM_AI_WORKFLOW.md, TASKS.md)
        - label: CI·GitHub 템플릿·.claude 설정
  - type: textarea
    id: contracts
    attributes:
      label: API·DB·데이터·계산 계약 변경
      description: 없으면 "없음". 있으면 PROJECT_CONTEXT §6 중 어떤 항목에 영향을 주는지 적는다. 되돌리기 어려우면 ADR이 필요하다.
      value: 없음
    validations:
      required: true
  - type: input
    id: base
    attributes:
      label: 선행 작업과 base
      placeholder: "선행 #12 병합 후, base main@abc1234"
  - type: textarea
    id: done
    attributes:
      label: 완료 조건과 검증 명령
      value: |
        - [ ] git diff --check
        - [ ] npm --prefix app run verify:fast
    validations:
      required: true
  - type: dropdown
    id: ai-permission
    attributes:
      label: AI 권한
      options:
        - 파일 수정과 검증까지 (commit·push는 사람)
        - commit까지 (push는 사람)
        - commit·push·draft PR까지
    validations:
      required: true
