name: 작업
description: 목표·범위·완료 조건을 정하고 자신을 assignee로 지정한다. 이 Issue 번호가 branch 이름에 들어간다.
title: "[작업] "
body:
  - type: textarea
    id: goal
    attributes:
      label: 목표
      description: 사용자에게 달라지는 점 또는 정할 것 하나.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 범위
      description: 수정할 경로와 하지 않을 일. AGENTS.md §5 공유 파일이나 §3 데이터·계산 계약을 건드리면 적는다.
      placeholder: |
        수정: app/src/features/market/, docs/domains/market.md
        하지 않음:
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 완료 조건
      value: |
        - [ ]
        - [ ] npm --prefix app run verify:fast
    validations:
      required: true
