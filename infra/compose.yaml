name: trendbench-mvp
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: trendbench
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infra/.env}
      POSTGRES_DB: trendbench_mvp
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - mvp_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trendbench -d trendbench_mvp"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  mvp_postgres_data:
